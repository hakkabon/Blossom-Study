[package]
name = "blossom_study"
version = "0.1.0"
edition = "2024"

[lib]
name = "blossom_study"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
integer-blossom = "1.2.1"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
rustyline = "13.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "blossom_study"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "bench/main.rs"
